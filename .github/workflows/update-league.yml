name: Update league data

on:
  schedule:
    - cron: "37 11 * * 2"   # Tuesdays 6:37 am Central, after Monday Night Football
    - cron: "37 15 * * 2"   # Tuesday afternoon backup
    - cron: "37 11 * * 3"   # Wednesday backup
  workflow_dispatch:        # "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch league from ESPN
        run: python fetch_league.py --out docs/league.json
        env:
          ESPN_LEAGUE_ID: ${{ vars.ESPN_LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
      - name: Commit updated data
        run: |
          git config user.name "league-bot"
          git config user.email "league-bot@users.noreply.github.com"
          git add docs/league.json data/seasons
          git diff --cached --quiet || git commit -m "Update league data"
          git push
