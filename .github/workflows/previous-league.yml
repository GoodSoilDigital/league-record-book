name: Previous league champions

on:
  workflow_dispatch:        # run by hand from the Actions tab; only needed once

permissions:
  contents: write

jobs:
  champions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch champions from the previous league
        run: python fetch_league.py --league-id 1446935 --champions-only --start 2016 --end 2018 --out docs/previous-league.json
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
      - name: Commit the champions file
        run: |
          git config user.name "league-bot"
          git config user.email "league-bot@users.noreply.github.com"
          git add docs/previous-league.json
          git diff --cached --quiet || git commit -m "Add previous league champions"
          git push
